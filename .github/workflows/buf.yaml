---
name: buf

on:
  pull_request:
    paths:
      - proto/**
      - buf.yaml
      - .github/workflows/buf.yaml

permissions:
  contents: read

jobs:
  # dicerd.v1 is a compatibility promise: a pull request may add to it, but
  # not change or remove what clients already rely on.
  breaking:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Check the API for breaking changes
        env:
          REPOSITORY: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
        run: make breaking BUF_AGAINST="https://github.com/$REPOSITORY.git#branch=$BASE_REF"
