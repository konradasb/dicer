---
name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      # The packages that embed binaries do not compile without them.
      - name: Build embedded binaries
        run: make embedded hypervisor-binaries

      - name: Lint
        run: make lint

      - name: Check formatting
        run: |
          make fmt
          git diff --exit-code

  # Mistakes in the workflows themselves (actionlint), and what makes one
  # exploitable (zizmor): unpinned actions, injection, broad permissions.
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      # With a token zizmor also runs its online audits, such as for actions
      # with known vulnerabilities.
      - name: Lint workflows
        run: make lint-workflows
        env:
          GH_TOKEN: ${{ github.token }}

  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Check licence headers
        run: make license-check

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Check generated code is up to date
        run: |
          make generate
          git diff --exit-code

      - name: Check go.mod is tidy
        run: go mod tidy -diff

      # The documentation site's reference pages are generated from the
      # code and committed; new pages count as much as changed ones.
      - name: Check the documentation's reference is up to date
        run: |
          make docs-gen
          test -z "$(git status --porcelain docs/content)" || {
            git status --porcelain docs/content
            echo "run make docs-gen and commit the result"
            exit 1
          }
